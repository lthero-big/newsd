[project]
name = "newsd"
version = "0.1.2"
description = "Self-hosted, multi-user AI news daily (successor of news-daily)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10,<4",
  "cryptography>=42",
  "httpx>=0.27",
  "alembic>=1.13",
  "trafilatura>=1.8",
  "tzdata",  # NEWSD_WORKER_TZ on slim images
  "psycopg[binary]>=3.1",  # Postgres (Supabase on Vercel, compose profile); Vercel installs only these core dependencies
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
postgres = ["psycopg[binary]>=3.1"]  # kept for existing install commands; now a core dependency

[project.scripts]
newsd = "newsd.cli:main"

# Vercel (DEPTAI-216 4d): the app and its build step, see docs/vercel.md and vercel.json
[tool.vercel]
entrypoint = "newsd.vercel:app"

[tool.vercel.scripts]
build = "python -m newsd.vercel_build"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["newsd*"]

[tool.setuptools.package-data]
newsd = ["web/templates/**/*.html", "web/static/**/*", "migrations/script.py.mako", "llm/profiles/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # test the checkout you are in, even when the venv was installed from another one

[tool.ruff]
line-length = 140
extend-exclude = ["newsd/migrations/versions"]

[tool.ruff.lint]
# Correctness-focused: pyflakes (unused imports/variables, undefined names), syntax errors, import placement.
# The code base deliberately uses compact one-liners (`a = 1; b = 2`, short lambdas, `l`/`s` loop names), so the
# purely stylistic E701/E702/E731/E741 are off rather than reformatting 100+ lines.
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# sys.path / env set-up has to run before these imports
"tests/**" = ["E402"]
"scripts/**" = ["E402"]
