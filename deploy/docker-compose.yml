# newsd: deploy from the prebuilt Docker Hub image, no source checkout needed.
#   mkdir newsd && cd newsd
#   curl -fsSL -o docker-compose.yml https://raw.githubusercontent.com/lthero-big/newsd/main/deploy/docker-compose.yml
#   echo "NEWSD_SECRET_KEY=$(openssl rand -base64 48 | tr -d '\n=+/')" > .env   # keep this key, never change it
#   docker compose up -d
#   docker compose exec web newsd create-admin admin
# Options go in .env next to this file (full list: https://github.com/lthero-big/newsd/blob/main/.env.example):
#   NEWSD_PORT=127.0.0.1:8080       behind a reverse proxy (default 8080 on all interfaces)
#   NEWSD_VERSION=0.2.0             pin a release (default latest)
#   COMPOSE_PROFILES=postgres       bundled Postgres; also set NEWSD_PG_PASSWORD and
#                                   NEWSD_DATABASE_URL=postgresql+psycopg://newsd:<same password>@db:5432/newsd
#   COMPOSE_PROFILES=updater        web "update" button (postgres,updater for both)
x-newsd: &newsd
  image: ${NEWSD_IMAGE:-lthero1/newsd}:${NEWSD_VERSION:-latest}
  env_file:
    - path: .env
      required: false
  environment:
    NEWSD_SECRET_KEY: ${NEWSD_SECRET_KEY:?set NEWSD_SECRET_KEY in .env (see the top of this file)}
    NEWSD_DATABASE_URL: ${NEWSD_DATABASE_URL:-sqlite:////data/newsd.db}
  volumes:
    - newsd-data:/data
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
      required: false  # only when the postgres profile is on

services:
  web:
    <<: *newsd
    ports:
      - "${NEWSD_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  # scheduler: collects the shared pool, then builds every user's issue at NEWSD_WORKER_TIMES (NEWSD_WORKER_TZ)
  worker:
    <<: *newsd
    command: ["newsd", "worker", "start"]
    depends_on:
      web:
        condition: service_healthy  # web runs the DB migrations first
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: newsd
      POSTGRES_USER: newsd
      POSTGRES_PASSWORD: ${NEWSD_PG_PASSWORD:-}
    volumes:
      - newsd-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newsd -d newsd"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  updater:
    image: ${NEWSD_IMAGE:-lthero1/newsd}:${NEWSD_VERSION:-latest}
    profiles: ["updater"]
    command: ["newsd", "updater"]
    env_file:
      - path: .env
        required: false
    environment:
      NEWSD_IMAGE: ${NEWSD_IMAGE:-lthero1/newsd}
    user: "0:0"  # to use /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  newsd-data:
  newsd-pg:
