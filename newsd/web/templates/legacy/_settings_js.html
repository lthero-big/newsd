
<script>
document.querySelectorAll(".kw-add").forEach((f) => f.addEventListener("submit", async (e) => {
  e.preventDefault(); const b = {kind: f.dataset.kind, term: f.term.value.trim()}; if (f.weight) b.weight = parseFloat(f.weight.value);
  const [ok, j] = await call("POST", "/api/me/keywords", b);
  if (ok) location.reload(); else $("#kw-status").textContent = "添加失败：" + (j.error || "");
}));
document.querySelectorAll("[data-del-kw]").forEach((b) => b.addEventListener("click", async () => {
  const [ok] = await call("DELETE", "/api/me/keywords/" + b.dataset.delKw); if (ok) b.closest("[data-kw]").remove();
}));
$("#add-quota").addEventListener("click", () => {
  const tr = document.createElement("tr");
  tr.innerHTML = '<td><input name="module" size="10"></td><td><input name="group_name" size="12"></td><td><input name="max_items" type="number" min="0" max="1000" value="10" style="width:5em"></td><td><input name="categories" size="18"></td><td><button type="button" class="rm-row">删除</button></td>';
  $("#quota-rows").appendChild(tr);
});
$("#quota-rows").addEventListener("click", (e) => { if (e.target.classList.contains("rm-row")) e.target.closest("tr").remove(); });
$("#quotas").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = [...document.querySelectorAll("#quota-rows tr")].map((tr) => {
    const v = (n) => tr.querySelector(`[name=${n}]`).value.trim();
    const cats = v("categories").split(/[,，]/).map((s) => s.trim()).filter(Boolean);
    return {module: v("module"), group_name: v("group_name"), max_items: parseInt(v("max_items") || "0", 10), categories: cats.length ? cats : null};
  });
  const [ok, j] = await call("PUT", "/api/me/quotas", body);
  $("#quota-status").textContent = ok ? "已保存" : "保存失败：" + (j.error || "");
});
function pushBody() {
  const f = $("#push"), v = (n) => f[n].value.trim();
  const keep = (n, clear) => (f[clear] && f[clear].checked) ? "" : (v(n) || null);  // null = keep stored, "" = clear
  return {enabled: f.enabled.checked, time: f.time.value, timezone: v("timezone"), channels: {
    email: {enabled: f["email-enabled"].checked, target: v("email-target")},
    telegram: {enabled: f["telegram-enabled"].checked, target: v("telegram-target"), token: keep("telegram-token", "telegram-token-clear")},
    webhook: {enabled: f["webhook-enabled"].checked, target: keep("webhook-target", "webhook-url-clear"), type: v("webhook-type"),
              mode: v("webhook-mode"), secret: keep("webhook-secret", "webhook-secret-clear"),
              template: v("webhook-template"), item_template: v("webhook-item_template")}}};
}
$("#push").addEventListener("submit", async (e) => {
  e.preventDefault();
  const [ok, j] = await call("PUT", "/api/me/push", pushBody());
  $("#push-status").textContent = ok ? "已保存" : "保存失败：" + (j.error || "");
  if (ok) setTimeout(() => location.reload(), 600);
});
document.querySelectorAll("[data-test]").forEach((b) => b.addEventListener("click", async () => {
  const c = b.dataset.test, out = document.querySelector(`[data-test-status=${c}]`);
  out.textContent = "保存并发送中…"; b.disabled = true;
  try {
    const [ok, j] = await call("PUT", "/api/me/push", pushBody());   // the test uses the saved config, so save the form first
    if (!ok) { out.textContent = "保存失败：" + (j.error || ""); return; }
    const [ok2, r] = await call("POST", "/api/me/push/test/" + c);
    out.textContent = !ok2 ? "无法发送：" + (r.error || "") : r.ok ? "测试消息已发送" : "发送失败：" + (r.error || "");
  } finally { b.disabled = false; }
}));
</script>
