name: Docker image

# Publishes ghcr.io/<owner>/newsd when a release tag vX.Y.Z is pushed:
#   X.Y.Z, X.Y and latest (latest only for non-prerelease tags). Manual runs build and smoke-test without pushing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/newsd

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match newsd.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          code=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)', open('newsd/__init__.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag code=$code"
          test "$tag" = "$code" || { echo "::error::tag v$tag does not match newsd/__init__.py ($code)"; exit 1; }

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      # smoke test on amd64 before anything is pushed: the image starts, migrates SQLite and answers /healthz
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: newsd:smoke
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name smoke -e NEWSD_SECRET_KEY=smoke-test-secret -p 8080:8080 newsd:smoke
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"ok":true'
          test "$(docker exec smoke id -u)" = "10001"
          docker exec smoke newsd version
          docker logs smoke | tail -20
          docker rm -f smoke

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
